<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon. Was a blue roundel carrying a "P" — left over from the original
    brief's Wet Paint Blue, never updated when the site took the client's
    orange, so every browser tab showed a colour that appears nowhere else on
    the site.

    Now the logo's own gesture: the curved brush stroke with its drip. Solid
    ground rather than an outline, because this renders at 16px in a tab and
    thin strokes disappear there. The bright logo orange is safe here — nothing
    has to be read against it.
  -->
  <rect width="64" height="64" rx="12" fill="#f26522"/>
  <path
    d="M45 15c-12.7 0-23 8.7-23 19.5C22 41.3 26 47.1 32 50.4"
    fill="none"
    stroke="#fff"
    stroke-width="7.5"
    stroke-linecap="round"
  />
  <path
    d="M32 50.4c3.6 1.9 7.9 3 12.5 3"
    fill="none"
    stroke="#fff"
    stroke-width="7.5"
    stroke-linecap="round"
  />
  <circle cx="50" cy="53" r="3.4" fill="#fff"/>
</svg>
