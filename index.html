<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security header fallbacks (in case the CDN strips headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; block-all-mixed-content" />

    <title>Quooro | Professional Websites — Local, Nationwide & Worldwide</title>
    <meta name="description" content="Professional websites for businesses — serving clients locally, nationwide, and worldwide. Pricing tailored to your requirements, no jargon, expert support." />
    <meta name="author" content="Quooro" />
    <!-- SVG first: it stays crisp at every size and in dark tab strips.
         The PNG and .ico are fallbacks for older browsers. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />


    <meta property="og:title" content="Quooro | Professional Websites — Local, Nationwide & Worldwide" />
    <meta property="og:description" content="Professional websites for businesses — serving clients locally, nationwide, and worldwide. Clear pricing, no jargon, expert support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://quooro.com/og-quooro.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1024" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Quooro" />
    <meta name="twitter:image" content="https://quooro.com/og-quooro.jpg" />

    <!-- Premium font stack: Sora (display), Work Sans/Inter (body), Instrument Serif,
         JetBrains Mono (code). Self-hosted via @fontsource in src/main.tsx so there is no
         render-blocking third-party stylesheet and no cross-origin font request. -->
      <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
